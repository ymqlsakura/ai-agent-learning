name: Daily Intel Scan

on:
  schedule:
    # UTC 1:07 = 北京时间 9:07（避开整点高峰）
    - cron: '7 1 * * *'
  # 手动触发（方便测试）
  workflow_dispatch:

# 权限：需要写 contents 才能 commit + push
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行每日情报扫描
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/daily_intel.py

      - name: 提交并推送变更
        # 只有当 memory/intel/ 下有文件变更时才 commit
        run: |
          git config user.name "小樱（GitHub Actions）"
          git config user.email "actions@ai-agent-learning"
          git add memory/intel/
          if git diff --cached --quiet; then
            echo "无新内容，跳过 commit。"
          else
            git commit -m "📰 每日情报简报 $(date +'%Y-%m-%d') [automated]"
            git push
            echo "已推送。"
          fi
