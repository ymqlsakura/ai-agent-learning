name: Daily Intel Review

on:
  # 在每日情报扫描完成后自动触发
  workflow_run:
    workflows: ["Daily Intel Scan"]
    types:
      - completed
  # 手动触发（方便测试）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # 仅在情报扫描成功时运行
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 拉取最新（获取刚推送的情报）
        run: git pull

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行多 Agent 研判
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: |
          DATE=$(python -c "from datetime import datetime, timezone, timedelta; tz=timezone(timedelta(hours=8)); print(datetime.now(tz).strftime('%Y-%m-%d'))")
          python scripts/supervisor.py --goal goals/intel-review.json --date "$DATE"

      - name: 提交并推送研判结果
        run: |
          git config user.name "小樱（Supervisor）"
          git config user.email "actions@ai-agent-learning"
          git add memory/intel/
          if git diff --cached --quiet; then
            echo "研判结果无变更，跳过 commit。"
          else
            git commit -m "🤖 多 Agent 研判 $(date +'%Y-%m-%d') [Kimi K3 + DeepSeek]"
            git push
            echo "已推送。"
          fi

      - name: 📧 邮件发送日报
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_AUTH: ${{ secrets.QQ_SMTP_AUTH }}
        run: |
          python -c "
          import smtplib, sys, os, re, json
          from datetime import datetime, timezone, timedelta
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from pathlib import Path

          tz = timezone(timedelta(hours=8))
          today = datetime.now(tz).strftime('%Y-%m-%d')

          daily_path = Path(f'memory/intel/daily-{today}.md')
          actions_path = Path(f'memory/intel/actions-{today}.md')
          json_path = Path(f'memory/intel/daily-{today}.json')

          if not daily_path.exists():
              print(f'❌ 日报不存在: {daily_path}')
              sys.exit(0)

          # 尝试从 JSON 读取结构化分数（带 per-worker 明细）
          worker_scores = {}
          if json_path.exists():
              try:
                  data = json.loads(json_path.read_text(encoding='utf-8'))
                  for s in data.get('scores', []):
                      worker_scores[s['num']] = s.get('worker_scores', {})
              except Exception:
                  pass

          # 解析日报 markdown 表格
          raw = daily_path.read_text(encoding='utf-8')

          # 提取每篇文章
          articles = []
          # 按 ### N. 标题 分割
          article_blocks = re.split(r'\n(?=### \d+\.)', raw)
          for block in article_blocks:
              m = re.match(r'### \d+\.\s+\[(.+?)\]\((.+?)\)', block)
              if not m:
                  continue
              title = m.group(1).strip()
              link = m.group(2).strip()
              snippet = ''
              sm = re.search(r'\n\n(.+?)\n\n\s*-', block, re.DOTALL)
              if sm:
                  snippet = sm.group(1).strip()[:200]
              # 标签
              tags = re.findall(r'标签:\s*(.+)', block)
              tag_str = tags[0].strip() if tags else ''
              articles.append({'title': title, 'link': link, 'snippet': snippet, 'tags': tag_str})

          # 解析研判表格
          scored = []
          table_header = re.search(r'\|\s*#\s*\|.*\n\|\s*---.*\n((?:\|.*\n)+)', raw)
          if table_header:
              rows = table_header.group(1).strip().split('\n')
              for row in rows:
                  cells = [c.strip() for c in row.split('|') if c.strip()]
                  if len(cells) >= 7:
                      try:
                          num = int(cells[0])
                          scored.append({
                              'num': num,
                              'relevance': cells[1],
                              'feasibility': cells[2],
                              'leverage': cells[3],
                              'total': cells[4],
                              'action': cells[5],
                          })
                      except ValueError:
                          pass

          # 解析行动建议
          actions = ''
          if actions_path.exists():
              actions_raw = actions_path.read_text(encoding='utf-8')
              # 提取每个行动标题
              act_titles = re.findall(r'### 行动 \d+：(.+)', actions_raw)
              if act_titles:
                  actions = '\n'.join(f'• {t}' for t in act_titles)

          # 构建邮件 HTML
          score_rows = ''
          for s in scored:
              num = s['num']
              art = articles[num-1] if num <= len(articles) else None
              title = art['title'] if art else '?'
              link = art['link'] if art else '#'
              tags = art['tags'] if art else ''

              # worker 打分明细
              ws = worker_scores.get(num, {})
              ws_detail = ''
              if ws:
                  ws_detail = '<br>'.join(
                      f\"{w.upper()}：{d['relevance']}+{d['feasibility']}+{d['leverage']}={d['total']}\"
                      for w, d in ws.items()
                  )

              score_rows += f'''
              <tr>
                <td style=\"padding:8px 10px;border-bottom:1px solid #eee;vertical-align:top\">
                  <a href=\"{link}\" style=\"color:#1a73e8;text-decoration:none;font-weight:bold\">#{num} {title}</a>
                  <div style=\"font-size:11px;color:#999\">{tags}</div>
                </td>
                <td style=\"padding:8px 10px;border-bottom:1px solid #eee;text-align:center;white-space:nowrap\">
                  <span style=\"font-size:18px;font-weight:bold;color:#222\">{s['total']}</span>
                  <div style=\"font-size:11px;color:#666\">{ws_detail if ws_detail else f\"R{s['relevance']}+F{s['feasibility']}+L{s['leverage']}\"}</div>
                </td>
                <td style=\"padding:8px 10px;border-bottom:1px solid #eee;font-size:13px;color:#555\">
                  {s['action']}
                </td>
              </tr>'''

          body = f'''<html><body style=\"font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:600px;margin:0 auto;padding:20px\">
          <h2>☀️ 小樱日报 {today}</h2>
          <p style=\"color:#666\">4 个 AI 交叉审查 · {len(articles)} 篇文章 · {len(scored)} 条已评分</p>

          <table style=\"width:100%;border-collapse:collapse;margin:15px 0\">
          <tr style=\"background:#f5f5f5\">
            <th style=\"padding:8px 10px;text-align:left\">文章</th>
            <th style=\"padding:8px 10px;text-align:center;width:80px\">总分</th>
            <th style=\"padding:8px 10px;text-align:left\">建议</th>
          </tr>
          {score_rows}
          </table>
          '''

          if actions:
              body += f'''
          <div style=\"background:#f9f9f9;border-radius:8px;padding:15px;margin:15px 0\">
            <strong>💡 今日行动建议</strong>
            <div style=\"margin-top:8px;line-height:1.8\">{actions}</div>
          </div>'''

          body += f'''
          <div style=\"background:#e8f0fe;border-radius:8px;padding:15px;margin:15px 0\">
            <strong>🔗 完整日报</strong><br>
            <a href=\"https://github.com/ymqlsakura/ai-agent-learning/blob/main/memory/intel/daily-{today}.md\" style=\"color:#1a73e8\">查看原文（GitHub）</a>
            &nbsp;|&nbsp;
            <a href=\"https://github.com/ymqlsakura/ai-agent-learning/blob/main/memory/intel/actions-{today}.md\" style=\"color:#1a73e8\">行动建议详情</a>
          </div>

          <hr>
          <p style=\"color:#999;font-size:11px\">🤖 全自动 AI 情报研判系统 · Kimi K3 + DeepSeek V4 Flash + GLM-4-Flash 交叉审查 · 每日成本约 ¥0.07</p>
          </body></html>'''

          msg = MIMEMultipart()
          msg['From'] = os.environ['QQ_EMAIL']
          msg['To'] = os.environ['QQ_EMAIL']
          msg['Subject'] = f'📰 小樱日报 {today} — {len(scored)} 条情报'

          msg.attach(MIMEText(body, 'html', 'utf-8'))

          server = smtplib.SMTP_SSL('smtp.qq.com', 465)
          server.login(os.environ['QQ_EMAIL'], os.environ['QQ_SMTP_AUTH'])
          server.send_message(msg)
          server.quit()
          print(f'✅ 日报已发送——{len(scored)} 篇文章、{len(actions)} 条行动建议')
          "
