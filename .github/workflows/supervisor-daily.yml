name: Daily Intel Review

on:
  # 在每日情报扫描完成后自动触发
  workflow_run:
    workflows: ["Daily Intel Scan"]
    types:
      - completed
  # 手动触发（方便测试）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # 仅在情报扫描成功时运行
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 拉取最新（获取刚推送的情报）
        run: git pull

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行多 Agent 研判
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: |
          DATE=$(python -c "from datetime import datetime, timezone, timedelta; tz=timezone(timedelta(hours=8)); print(datetime.now(tz).strftime('%Y-%m-%d'))")
          python scripts/supervisor.py --goal goals/intel-review.json --date "$DATE"

      - name: 提交并推送研判结果
        run: |
          git config user.name "小樱（Supervisor）"
          git config user.email "actions@ai-agent-learning"
          git add memory/intel/
          if git diff --cached --quiet; then
            echo "研判结果无变更，跳过 commit。"
          else
            git commit -m "🤖 多 Agent 研判 $(date +'%Y-%m-%d') [Kimi K3 + DeepSeek]"
            git push
            echo "已推送。"
          fi

      - name: 📧 邮件发送日报
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_AUTH: ${{ secrets.QQ_SMTP_AUTH }}
        run: |
          python -c "
          import smtplib, email, sys, os
          from datetime import datetime, timezone, timedelta
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from pathlib import Path

          tz = timezone(timedelta(hours=8))
          today = datetime.now(tz).strftime('%Y-%m-%d')
          summary_path = Path(f'memory/intel/daily-summary-{today}.md')

          if not summary_path.exists():
              print(f'❌ 日报文件不存在: {summary_path}')
              sys.exit(0)

          content = summary_path.read_text(encoding='utf-8')

          msg = MIMEMultipart()
          msg['From'] = os.environ['QQ_EMAIL']
          msg['To'] = os.environ['QQ_EMAIL']
          msg['Subject'] = f'📰 小樱日报 {today}'

          # 只取 Top 3 部分，去掉多余内容
          body = f'''<h2>☀️ {today} 每日情报</h2>
          <pre style=\"white-space:pre-wrap;font-family:inherit;\">{content}</pre>
          <hr>
          <p style=\"color:#999;font-size:12px;\">🤖 全自动生成——4 个 AI 交叉审查，每天成本 ¥0.06</p>
          '''

          msg.attach(MIMEText(body, 'html', 'utf-8'))

          server = smtplib.SMTP_SSL('smtp.qq.com', 465)
          server.login(os.environ['QQ_EMAIL'], os.environ['QQ_SMTP_AUTH'])
          server.send_message(msg)
          server.quit()
          print(f'✅ 日报已发送到 {os.environ[\"QQ_EMAIL\"]}')
          "
